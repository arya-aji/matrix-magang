# LOCAL DEVELOPMENT ONLY.
#
# For production on Coolify, do NOT deploy this compose file. Deploy the app from
# the Dockerfile and connect it to a separate Coolify PostgreSQL resource (which
# has its own persistent volume). Compose volumes can be renamed/recreated when
# the Coolify resource is recreated, which makes the database appear "lost".
#
# `name: inma` pins the compose project name so the named volume keeps a stable
# name (`inma_inma-db-data`) across local re-creations.
name: inma

services:
  db:
    image: postgres:17-alpine
    container_name: inma-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: inma
      POSTGRES_PASSWORD: inma_dev_password
      POSTGRES_DB: intern_matrix
    ports:
      - "5432:5432"
    volumes:
      - inma-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inma -d intern_matrix"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inma-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://inma:inma_dev_password@db:5432/intern_matrix
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-please-replace}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_TIMEZONE: Asia/Jakarta
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  inma-db-data:
